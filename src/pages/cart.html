<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernStore - Shopping Cart</title>
    <meta name="description" content="Review your shopping cart and checkout">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="multipage-enhancements.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <!-- Navigation Header -->
    <header class="header" role="banner">
        <nav class="navbar" role="navigation" aria-label="Main navigation">
            <div class="nav-container">
                <div class="nav-brand">
                    <a href="../../index.html" class="brand-link" aria-label="Go to homepage">
                        <h1 class="brand-title">ModernStore</h1>
                    </a>
                </div>
                
                <!-- Desktop Navigation -->
                <ul id="nav-menu" class="nav-menu">
                    <li>
                        <a href="../../index.html" class="nav-link" aria-label="Home page">Home</a>
                    </li>
                    <li>
                        <a href="products.html" class="nav-link" aria-label="Products page">Products</a>
                    </li>
                    <li>
                        <a href="cart.html" class="nav-link cart-link" aria-label="Shopping cart">
                            Cart <span class="cart-count" aria-label="Items in cart" aria-live="polite">0</span>
                        </a>
                    </li>
                </ul>
                
                <!-- Mobile Menu Toggle -->
                <button class="mobile-menu-toggle" type="button" aria-label="Toggle mobile menu" aria-expanded="false" aria-controls="nav-menu">
                    <span class="hamburger-line" aria-hidden="true"></span>
                    <span class="hamburger-line" aria-hidden="true"></span>
                    <span class="hamburger-line" aria-hidden="true"></span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main id="main-content" class="main-content" role="main">
        
        <!-- Shopping Cart Page Section -->
        <section id="cart" class="page-section active" aria-labelledby="cart-title">
            <div class="container">
                <header class="page-header">
                    <h2 id="cart-title">Shopping Cart</h2>
                </header>
                
                <div class="cart-content" id="cart-content" role="region" aria-label="Shopping cart items" aria-live="polite">
                    <div class="empty-cart">
                        <p>Your cart is empty</p>
                        <a href="products.html" class="cta-button">Continue Shopping</a>
                    </div>
                </div>
                
                <div class="cart-summary" id="cart-summary" style="display: none;">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax:</span>
                        <span id="cart-tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <a href="checkout.html" class="checkout-button" aria-describedby="cart-total">Proceed to Checkout</a>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
        <div class="container">
            <p>&copy; 2024 ModernStore. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script defer src="script-multipage.js"></script>
</body>
</html>
