<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ModernStore</title>
  <style>
    :root { --primary:#3b82f6; --primary-dark:#2563eb; --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-600:#4b5563; --gray-900:#111827; --white:#fff; --success:#10b981; --error:#ef4444; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;color:var(--gray-900);background:var(--gray-50)}
    .container{max-width:1200px;margin:0 auto;padding:0 1rem}
    .header{background:var(--white);border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:10}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 0;gap:2rem}
    .logo{font-size:1.5rem;font-weight:700;color:var(--primary);text-decoration:none}
    .nav-links{display:flex;list-style:none;gap:2rem}
    .nav-links a{text-decoration:none;color:var(--gray-600);font-weight:500}
    .nav-links a:hover,.nav-links a.active{color:var(--primary)}
    .page{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center;min-height:calc(100vh - 160px)}
    .hero img{width:100%;height:420px;object-fit:cover;border-radius:1rem;box-shadow:0 10px 25px rgba(0,0,0,.1)}
    .card{background:var(--white);border:1px solid var(--gray-200);border-radius:1rem;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:2rem}
    h1{font-size:2rem;margin-bottom:1rem}
    p.lead{color:var(--gray-600);margin-bottom:1.5rem}
    .form-group{margin-bottom:1rem}
    label{display:block;font-weight:600;margin-bottom:.5rem;color:var(--gray-900)}
    input[type=email],input[type=password]{width:100%;padding:.75rem 1rem;border:1px solid var(--gray-200);border-radius:.5rem;font-size:.9rem}
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    .row{display:flex;justify-content:space-between;align-items:center;margin:.5rem 0 1rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1.5rem;border:none;border-radius:.75rem;font-weight:600;cursor:pointer;text-decoration:none}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .muted{color:var(--gray-600)}
    .center{text-align:center;margin-top:1rem}
    .alert{padding:.75rem 1rem;border-radius:.5rem;margin-bottom:1rem;display:none}
    .alert.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    .success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
    @media(max-width:768px){.page{grid-template-columns:1fr}.hero img{height:260px}}
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="../../index.html" class="logo">ModernStore</a>
        <ul class="nav-links">
          <li><a href="../../index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:2rem 0 3rem">
    <div class="page">
      <div class="hero">
        <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=800&q=80" alt="Welcome back">
      </div>
      <div class="card">
        <h1>Welcome back</h1>
        <p class="lead">Sign in to access your orders and a faster checkout.</p>
        <div id="alert" class="alert error" role="alert"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="********" required />
          </div>
          <div class="row">
            <label style="display:flex;align-items:center;gap:.5rem"><input type="checkbox" id="remember"/> Remember me</label>
            <a class="muted" href="#">Forgot password?</a>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%">Sign In</button>
        </form>
        <div class="center muted">Don't have an account? <a href="register.html">Create one</a></div>
      </div>
    </div>
  </main>

  <script src="../scripts/utils/auth-utils.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alert');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = form.email.value;
      const password = form.password.value;
      try{
        Auth.loginUser(email, password);
        if (document.getElementById('remember').checked) {
          // keep user in localStorage (already stored by Auth)
        }
        alertBox.className = 'alert success';
        alertBox.textContent = 'Login successful! Redirecting...';
        alertBox.style.display = 'block';
        setTimeout(()=> window.location.href = '../index.html', 800);
      }catch(err){
        alertBox.className = 'alert error';
        alertBox.textContent = err.message || 'Login failed';
        alertBox.style.display = 'block';
      }
    });
  </script>
  <script src="../scripts/utils/auth-utils.js"></script>
  <script src="../scripts/nav-auth.js"></script>
</body>
</html>
