<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernStore - Product Details</title>
    <meta name="description" content="View detailed product information">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="multipage-enhancements.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <!-- Navigation Header -->
    <header class="header" role="banner">
        <nav class="navbar" role="navigation" aria-label="Main navigation">
            <div class="nav-container">
                <div class="nav-brand">
                    <a href="../../index.html" class="brand-link" aria-label="Go to homepage">
                        <h1 class="brand-title">ModernStore</h1>
                    </a>
                </div>

                <!-- Desktop Navigation -->
                <ul id="nav-menu" class="nav-menu">
                    <li>
                        <a href="../../index.html" class="nav-link" aria-label="Home page">Home</a>
                    </li>
                    <li>
                        <a href="products.html" class="nav-link" aria-label="Products page">Products</a>
                    </li>
                    <li>
                        <a href="cart.html" class="nav-link cart-link" aria-label="Shopping cart">
                            Cart <span class="cart-count" aria-label="Items in cart" aria-live="polite">0</span>
                        </a>
                    </li>
                </ul>

                <!-- Mobile Menu Toggle -->
                <button class="mobile-menu-toggle" type="button" aria-label="Toggle mobile menu" aria-expanded="false"
                    aria-controls="nav-menu">
                    <span class="hamburger-line" aria-hidden="true"></span>
                    <span class="hamburger-line" aria-hidden="true"></span>
                    <span class="hamburger-line" aria-hidden="true"></span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main id="main-content" class="main-content" role="main">

        <!-- Product Detail Page Section -->
        <section id="product-detail" class="page-section active" aria-labelledby="product-detail-title">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="../index.html" class="breadcrumb-link">Home</a>
                    <span class="breadcrumb-separator">/</span>
                    <a href="products.html" class="breadcrumb-link">Products</a>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-current" id="breadcrumb-product-name">Product Details</span>
                </nav>

                <div class="product-detail-content" id="product-detail-content">
                    <!-- Product detail content will be dynamically inserted here -->
                    <div class="product-placeholder">
                        <h2 id="product-detail-title">Product Details</h2>
                        <p>Select a product to view details...</p>
                        <a href="products.html" class="btn btn-primary">Browse Products</a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
        <div class="container">
            <p>&copy; 2024 ModernStore. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script defer src="script-multipage.js"></script>
</body>

</html>
