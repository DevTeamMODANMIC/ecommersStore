<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernStore - Quick Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8fafc;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .test-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .test-button:hover { background: #0056b3; }
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🚀 ModernStore Quick Test</h1>
        <p>Testing the enhanced ModernStore website functionality and appearance.</p>
        
        <div class="test-controls">
            <button class="test-button" onclick="testHomePage()">Test Home Page</button>
            <button class="test-button" onclick="testProductsPage()">Test Products Page</button>
            <button class="test-button" onclick="testResponsive()">Test Responsive</button>
        </div>
        
        <div id="test-results"></div>
        
        <h3>Live Preview:</h3>
        <iframe id="preview-frame" src="index.html"></iframe>
        
        <div class="test-links">
            <h3>Quick Navigation:</h3>
            <button class="test-button" onclick="loadPage('index.html')">Home</button>
            <button class="test-button" onclick="loadPage('products.html')">Products</button>
            <button class="test-button" onclick="loadPage('cart.html')">Cart</button>
            <button class="test-button" onclick="loadPage('checkout.html')">Checkout</button>
        </div>
    </div>

    <script>
        function logResult(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> - ${message}`;
            resultsDiv.appendChild(resultDiv);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        function loadPage(page) {
            const iframe = document.getElementById('preview-frame');
            iframe.src = page;
            logResult(`Loading ${page}`, 'info');
        }

        function testHomePage() {
            logResult('🏠 Testing Home Page...', 'info');
            
            // Test if index.html loads
            fetch('index.html')
                .then(response => {
                    if (response.ok) {
                        logResult('✅ index.html loads successfully', 'success');
                        return response.text();
                    } else {
                        throw new Error('Failed to load');
                    }
                })
                .then(html => {
                    // Check for key elements
                    if (html.includes('hero-section')) {
                        logResult('✅ Hero section found', 'success');
                    } else {
                        logResult('❌ Hero section missing', 'error');
                    }
                    
                    if (html.includes('featured-products')) {
                        logResult('✅ Featured products section found', 'success');
                    } else {
                        logResult('❌ Featured products section missing', 'error');
                    }
                    
                    if (html.includes('enhanced-styles.css')) {
                        logResult('✅ Enhanced styles linked', 'success');
                    } else {
                        logResult('❌ Enhanced styles not linked', 'error');
                    }
                    
                    if (html.includes('script-multipage.js')) {
                        logResult('✅ JavaScript file linked', 'success');
                    } else {
                        logResult('❌ JavaScript file not linked', 'error');
                    }
                })
                .catch(error => {
                    logResult(`❌ Error loading home page: ${error.message}`, 'error');
                });
        }

        function testProductsPage() {
            logResult('🛍️ Testing Products Page...', 'info');
            
            fetch('products.html')
                .then(response => {
                    if (response.ok) {
                        logResult('✅ products.html loads successfully', 'success');
                        return response.text();
                    } else {
                        throw new Error('Failed to load');
                    }
                })
                .then(html => {
                    if (html.includes('product-search')) {
                        logResult('✅ Search functionality found', 'success');
                    } else {
                        logResult('❌ Search functionality missing', 'error');
                    }
                    
                    if (html.includes('category-filter')) {
                        logResult('✅ Category filter found', 'success');
                    } else {
                        logResult('❌ Category filter missing', 'error');
                    }
                    
                    if (html.includes('products-grid')) {
                        logResult('✅ Products grid found', 'success');
                    } else {
                        logResult('❌ Products grid missing', 'error');
                    }
                })
                .catch(error => {
                    logResult(`❌ Error loading products page: ${error.message}`, 'error');
                });
        }

        function testResponsive() {
            logResult('📱 Testing Responsive Design...', 'info');
            
            fetch('enhanced-styles.css')
                .then(response => {
                    if (response.ok) {
                        logResult('✅ Enhanced styles file exists', 'success');
                        return response.text();
                    } else {
                        throw new Error('Enhanced styles not found');
                    }
                })
                .then(css => {
                    if (css.includes('@media')) {
                        logResult('✅ Media queries found in enhanced styles', 'success');
                    } else {
                        logResult('❌ No media queries in enhanced styles', 'error');
                    }
                    
                    if (css.includes('hero-section')) {
                        logResult('✅ Enhanced hero section styles found', 'success');
                    } else {
                        logResult('❌ Enhanced hero section styles missing', 'error');
                    }
                    
                    if (css.includes('product-card')) {
                        logResult('✅ Enhanced product card styles found', 'success');
                    } else {
                        logResult('❌ Enhanced product card styles missing', 'error');
                    }
                })
                .catch(error => {
                    logResult(`❌ Error testing responsive design: ${error.message}`, 'error');
                });
        }

        // Auto-run basic tests on load
        window.addEventListener('load', () => {
            logResult('🚀 ModernStore Quick Test Started', 'info');
            setTimeout(testHomePage, 1000);
        });
    </script>
</body>
</html>
